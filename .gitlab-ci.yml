stages:
  - build
  - test
  - publish

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"

default:
  image: mcr.microsoft.com/dotnet/sdk:10.0
  cache:
    key: nuget
    paths:
      - .nuget/packages

build:
  stage: build
  script:
    - dotnet restore agent.slnx
    - dotnet build agent.slnx --no-restore -c Release

test:
  stage: test
  script:
    - dotnet test agent.slnx -c Release --results-directory TestResults -- --report-trx
  artifacts:
    when: always
    paths:
      - TestResults/
    reports:
      junit: TestResults/**/*.trx

publish:
  stage: publish
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - dotnet publish src/Agent.Host -c Release -o publish/host
    - dotnet publish src/Agent.Cli -c Release -o publish/cli
  artifacts:
    paths:
      - publish/
