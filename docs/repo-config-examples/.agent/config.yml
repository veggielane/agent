# Example .agent/config.yml — copy to the root of a repository the agent works on.
# Everything is optional; the agent detects dotnet/npm/make/pytest projects when this file is absent.

build: dotnet build -warnaserror
test: dotnet test --no-build
lint: dotnet format --verify-no-changes

# Executables the agent may run in this repository, in addition to the global allow list.
allowedExecutables:
  - pwsh

# Globs the agent may read but never modify (merged with the global list).
protectedPaths:
  - deploy/**
  - "**/*.snk"
  - src/Generated/**

# Free-text guidance appended to the coding prompt (AGENTS.md is also read when present).
instructions: |
  Run the tests for the project you changed before calling done.
  Prefer extending existing abstractions over adding new ones.
